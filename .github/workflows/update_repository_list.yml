name: Update Repository List

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MY_GH_TOKEN }}

      - name: Fetch all repositories
        env:
          GH_TOKEN: ${{ secrets.MY_GH_TOKEN }}
        run: |
          gh api user/repos --paginate -q '.[] | "\(.owner.login)\t\(.name)\t\(.created_at)"' | \
          sort -k1,1 -k3,3 | \
          awk -F'\t' '{
            if (prev != "" && prev != $1) print "";
            print $1"/"$2;
            prev = $1
          }' > REPOSITORYLIST.md

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add REPOSITORYLIST.md
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes in repository list."
          else
            git commit -m "Auto-update repository list"
            git push
          fi
